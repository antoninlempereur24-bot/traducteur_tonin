<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Traducteur d'Alphabet Personnalisé</title>
    <!-- Chargement de Tailwind CSS pour un design moderne et responsive -->
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        /* Styles additionnels pour personnaliser la scrollbar du tableau */
        .scrollbar-hide::-webkit-scrollbar {
            display: none;
        }
        .scrollbar-hide {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }
    </style>
</head>
<body class="bg-slate-50 min-h-screen font-sans text-slate-800 flex flex-col">

    <header class="bg-white shadow-sm py-6 mb-8">
        <div class="max-w-5xl mx-auto px-4 text-center">
            <h1 class="text-3xl font-bold text-slate-800 tracking-tight">Traducteur d'Alphabet</h1>
            <p class="text-slate-500 mt-2">Traduisez instantanément du texte normal vers votre alphabet personnalisé, et vice versa.</p>
        </div>
    </header>

    <main class="flex-grow max-w-5xl mx-auto px-4 w-full">
        
        <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
            
            <!-- Panneau Texte Normal -->
            <div class="bg-white rounded-2xl shadow-md border border-slate-100 overflow-hidden flex flex-col">
                <div class="bg-blue-50 px-4 py-3 border-b border-blue-100 flex justify-between items-center">
                    <h2 class="font-semibold text-blue-800">Texte Normal</h2>
                    <button id="copy-normal" class="text-blue-600 hover:text-blue-800 bg-blue-100 hover:bg-blue-200 px-3 py-1.5 rounded-lg text-sm font-medium transition-colors flex items-center gap-2">
                        <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 16H6a2 2 0 01-2-2V6a2 2 0 012-2h8a2 2 0 012 2v2m-6 12h8a2 2 0 002-2v-8a2 2 0 00-2-2h-8a2 2 0 00-2 2v8a2 2 0 002 2z" />
                        </svg>
                        Copier
                    </button>
                </div>
                <textarea id="text-normal" class="w-full h-64 p-4 resize-none outline-none focus:ring-2 focus:ring-blue-500/50 text-lg transition-shadow bg-transparent" placeholder="Écrivez ou collez votre texte ici..."></textarea>
            </div>

            <!-- Panneau Texte Personnalisé -->
            <div class="bg-white rounded-2xl shadow-md border border-slate-100 overflow-hidden flex flex-col">
                <div class="bg-red-50 px-4 py-3 border-b border-red-100 flex justify-between items-center">
                    <h2 class="font-semibold text-red-800">Texte Personnalisé</h2>
                    <button id="copy-custom" class="text-red-600 hover:text-red-800 bg-red-100 hover:bg-red-200 px-3 py-1.5 rounded-lg text-sm font-medium transition-colors flex items-center gap-2">
                        <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 16H6a2 2 0 01-2-2V6a2 2 0 012-2h8a2 2 0 012 2v2m-6 12h8a2 2 0 002-2v-8a2 2 0 00-2-2h-8a2 2 0 00-2 2v8a2 2 0 002 2z" />
                        </svg>
                        Copier
                    </button>
                </div>
                <textarea id="text-custom" class="w-full h-64 p-4 resize-none outline-none focus:ring-2 focus:ring-red-500/50 text-lg transition-shadow bg-transparent text-red-700" placeholder="TrZWuXgIOM OY GECgE lEJuOMMAPIhE IXI..."></textarea>
            </div>

        </div>

        <div class="mt-12 mb-8 bg-white rounded-2xl shadow-md border border-slate-100 p-6">
            <h3 class="text-lg font-semibold text-center mb-6 text-slate-700">Table de correspondance</h3>
            <div class="w-full overflow-x-auto scrollbar-hide">
                <div class="min-w-max">
                    <div id="alphabet-normal-row" class="flex border-b border-slate-200 pb-2 mb-2 font-mono text-xl md:text-2xl font-bold text-blue-600">
                        <!-- Généré via JS -->
                    </div>
                    <div id="alphabet-custom-row" class="flex font-mono text-xl md:text-2xl font-bold text-red-600">
                        <!-- Généré via JS -->
                    </div>
                </div>
            </div>
            <p class="text-center text-sm text-slate-400 mt-6">La traduction est parfaitement réciproque. Les chiffres, accents et ponctuations restent identiques.</p>
        </div>

    </main>

    <!-- Zone invisible pour faciliter la copie du presse-papier -->
    <textarea id="hidden-copy-area" class="opacity-0 absolute -left-9999 pointer-events-none" aria-hidden="true" tabindex="-1"></textarea>

    <script>
        // Le dictionnaire de chiffrement (réciproque)
        // Les lettres qui ne changent pas (A, E, I, O, U, Y) sont incluses par principe.
        const dictionary = {
            'a': 'a', 'b': 'z', 'c': 'x', 'd': 'w',
            'e': 'e', 'f': 'v', 'g': 't', 'h': 's',
            'i': 'i', 'j': 'r', 'k': 'q', 'l': 'p',
            'm': 'n', 'n': 'm', 'o': 'o', 'p': 'l',
            'q': 'k', 'r': 'j', 's': 'h', 't': 'g',
            'u': 'u', 'v': 'f', 'w': 'd', 'x': 'c',
            'y': 'y', 'z': 'b'
        };

        // DOM Elements
        const textNormal = document.getElementById('text-normal');
        const textCustom = document.getElementById('text-custom');
        const btnCopyNormal = document.getElementById('copy-normal');
        const btnCopyCustom = document.getElementById('copy-custom');
        const rowNormal = document.getElementById('alphabet-normal-row');
        const rowCustom = document.getElementById('alphabet-custom-row');

        // Fonction de traduction d'un seul caractère
        function translateChar(char) {
            const isUpper = char === char.toUpperCase() && char !== char.toLowerCase();
            const lowerChar = char.toLowerCase();
            
            // Si le caractère est dans notre dictionnaire
            if (dictionary[lowerChar]) {
                const translated = dictionary[lowerChar];
                return isUpper ? translated.toUpperCase() : translated;
            }
            
            // Si c'est un symbole, un espace, un accent, on le retourne tel quel
            return char;
        }

        // Fonction pour traduire une chaîne complète
        function translateText(text) {
            let result = '';
            for (let i = 0; i < text.length; i++) {
                result += translateChar(text[i]);
            }
            return result;
        }

        // Écouteurs d'événements pour la traduction en temps réel
        textNormal.addEventListener('input', (e) => {
            textCustom.value = translateText(e.target.value);
        });

        textCustom.addEventListener('input', (e) => {
            // Puisque la traduction est réciproque, on peut utiliser la même fonction !
            textNormal.value = translateText(e.target.value);
        });

        function copyToClipboard(text, buttonElement) {
            // Utilisation de execCommand pour un maximum de compatibilité avec les iframes (demande stricte)
            const hiddenArea = document.getElementById('hidden-copy-area');
            hiddenArea.value = text;
            hiddenArea.select();
            
            try {
                const successful = document.execCommand('copy');
                if (successful) {
                    // Feedback visuel sur le bouton
                    const originalText = buttonElement.innerHTML;
                    buttonElement.innerHTML = `<svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4 text-green-600" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7" /></svg> Copié !`;
                    buttonElement.classList.replace('text-blue-600', 'text-green-600');
                    buttonElement.classList.replace('text-red-600', 'text-green-600');
                    
                    setTimeout(() => {
                        buttonElement.innerHTML = originalText;
                        buttonElement.classList.replace('text-green-600', buttonElement.id.includes('normal') ? 'text-blue-600' : 'text-red-600');
                    }, 2000);
                }
            } catch (err) {
                console.error('Erreur lors de la copie', err);
            }
        }

        btnCopyNormal.addEventListener('click', function() {
            copyToClipboard(textNormal.value, this);
        });

        btnCopyCustom.addEventListener('click', function() {
            copyToClipboard(textCustom.value, this);
        });

        const normalAlphabet = "ABCDEFGHIJKLMNOPQRSTUVWXYZ";
        const customAlphabet = normalAlphabet.split('').map(char => translateChar(char)).join('');

        // Construction du tableau visuel
        for (let i = 0; i < normalAlphabet.length; i++) {
            const letterWrapperClass = "flex-1 text-center min-w-[30px] md:min-w-[40px]";
            
            const normalDiv = document.createElement('div');
            normalDiv.className = letterWrapperClass;
            normalDiv.innerText = normalAlphabet[i];
            rowNormal.appendChild(normalDiv);

            const customDiv = document.createElement('div');
            customDiv.className = letterWrapperClass;
            customDiv.innerText = customAlphabet[i];
            rowCustom.appendChild(customDiv);
        }

    </script>
</body>
</html>
